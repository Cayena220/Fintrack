<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <!-- Everything above the water line, so the fin's base follows the wave. -->
    <clipPath id="above-water">
      <path d="M0 0 H512 V350 H428 q -43 -30 -86 0 t -86 0 t -86 0 t -86 0 H0 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <path clip-path="url(#above-water)" fill="url(#fin)"
        d="M124 380 C 176 318, 226 214, 252 156 C 270 116, 300 92, 352 84 C 322 122, 312 172, 318 226 C 322 280, 344 330, 392 380 Z"/>
  <path d="M84 350 q 43 -30 86 0 t 86 0 t 86 0 t 86 0" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 408 q 43 -24 86 0 t 86 0 t 86 0" fill="none" stroke="#A7F3D0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
</svg>
