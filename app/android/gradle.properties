# Sized for a 7-8 GB machine. The Flutter template's -Xmx8G heap is more than
# the whole PC has, so the build daemon ran Windows out of memory and crashed.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
# Fewer parallel tasks keeps peak memory down (default is one per CPU thread).
org.gradle.workers.max=4
# Release the daemon's memory after 15 idle minutes instead of 3 hours.
org.gradle.daemon.idletimeout=900000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
